¡Ahí te abrió el menú de clonar! En lugar de ese botón verde, haz lo siguiente:

1. Cierra ese menú flotante tocando en cualquier parte de afuera.
2. Toca el botón gris que tiene los **tres puntos (`...`)** al lado del botón verde **Code**.
3. En el menú que se despliega, selecciona la opción para crear un nuevo archivo (**Create new file**).
4. En el espacio para el nombre del archivo, escribe exactamente esto:
   `.github/workflows/static.yml`
5. Pega el código completo aquí abajo en el espacio grande:

```yaml
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
